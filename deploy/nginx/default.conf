# Static hosting for the generic "Gemini Enterprise · Antigravity 핸즈온 랩" portal (site_v2) on Cloud Run.
# The content is intentionally public (training material with fictitious sample data, no PII),
# read-only, and served same-origin only (no CORS headers are emitted).
#
# TODO(security): no per-IP rate limiting on purpose — trainees typically share one corporate
# NAT egress IP, so a per-IP limit would throttle a whole classroom. Abuse/cost is bounded by
# Cloud Run --max-instances and the read-only static content; add Cloud Armor if ever needed.

map $uri $lab_cache_control {
    # HTML is the only unversioned resource (css/js/media URLs carry ?v=<content hash>), so it is always
    # revalidated — a redeploy is visible on the next page view, never a 5-minute-old copy.
    default                                          "no-cache";
    ~*\.(?:css|js)$                                  "public, max-age=3600";
    ~*\.(?:webp|png|jpg|jpeg|svg|ico|woff2|mp4|vtt)$ "public, max-age=86400";
}

server {
    listen 8080;
    # Cloud Run is deployed with --use-http2: requests arrive as HTTP/2 cleartext (h2c, prior knowledge).
    # End-to-end HTTP/2 lifts Cloud Run's 32 MiB limit on HTTP/1 responses (long lab videos).
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    autoindex off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/vtt text/plain;

    # Allow-list of HTTP methods: read-only site.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    include /etc/nginx/snippets/security_headers.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    # WebVTT captions are not in nginx's default mime.types.
    location ~* \.vtt$ {
        default_type text/vtt;
        try_files $uri =404;
    }

    # Practice files: always download, never render inline.
    location /assets/files/ {
        include /etc/nginx/snippets/security_headers.conf;
        add_header Content-Disposition "attachment" always;
        try_files $uri =404;
    }

    # Hide dotfiles and build leftovers.
    location ~ /\. {
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
